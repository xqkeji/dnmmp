# CRM 示例站点：crm.xqkeji.dev（仅 nginx 配置，项目代码自备）
# 把 CRM 代码放到 www/crm/www（容器内 /home/www/crm/www），入口 index.php
# 证书由 ssl.sh 生成，已覆盖 *.xqkeji.dev，无需重签
# 访问前在宿主机 hosts 加一行：127.0.0.1 crm.xqkeji.dev
server {
	listen       443 ssl;
	server_name  crm.xqkeji.dev;
	error_log  /home/log/crm.log;

	ssl_certificate     /etc/nginx/ssl/local.pem;
	ssl_certificate_key /etc/nginx/ssl/local-key.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_ciphers         HIGH:!aNULL:!MD5;
	ssl_session_cache   shared:SSL:10m;
	ssl_session_timeout 10m;

	root    "/home/www/crm/www";
	location / {
		index  index.html index.htm index.php;
		autoindex  off;
		try_files $uri $uri/ /index.php?_url=$uri&$args;
	}
	location ~ \.php(.*)$  {
		try_files		$uri = 404;
		fastcgi_pass   172.0.0.10:9000;
		fastcgi_index  index.php;
		fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
		fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
		fastcgi_param  PATH_INFO  $fastcgi_path_info;
		fastcgi_param  PATH_TRANSLATED  $document_root$fastcgi_path_info;
		include        fastcgi_params;
	}

}